<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Калькулятор Монет</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #101319; color: #edf0f6; font: 16px/1.5 system-ui, sans-serif; }
  main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: clamp(24px, 5vw, 64px) 0; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { margin: 0; font-size: clamp(29px, 5vw, 52px); letter-spacing: -.045em; line-height: 1.1; }
  h2 { margin: 0 0 15px; font-size: 19px; line-height: 1.25; }
  p { margin: 12px 0 0; color: #b3bdcc; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  section { min-width: 0; padding: 19px; background: #191e27; border: 1px solid #313a48; border-radius: 15px; }
  .rates { margin-bottom: 16px; }
  .rates-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(105px, 43%); align-items: center; gap: 10px; padding: 4px 0; }
  label, .row span { font-size: 14px; }
  input, output { justify-self: end; width: 100%; max-width: 220px; min-width: 0; min-height: 40px; font: inherit; font-variant-numeric: tabular-nums; text-align: right; border-radius: 7px; padding: 7px 9px; }
  input { background: #202e44; border: 1px solid #526f9c; color: #e3edff; }
  input[aria-invalid="true"] { border-color: #ff9d95; }
  output { overflow-wrap: anywhere; }
  output { background: #183128; border: 1px solid #38634e; color: #a3efc9; }
  output[data-error] { color: #ffd492; }
  button { font: inherit; color: #edf0f6; border: 1px solid #526078; border-radius: 8px; background: #202631; padding: 8px 12px; cursor: pointer; }
  .calculator-picker { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 20px 0 28px; }
  .calculator-picker button { min-height: 56px; text-align: left; }
  .calculator-picker button[aria-expanded="true"] { background: #202e44; border-color: #88a9dc; }
  .calculator-picker button:disabled { color: #a8b2c2; background: #191e27; border-color: #313a48; cursor: default; }
  .calculator-heading { margin: 0; font-size: clamp(22px, 4vw, 34px); }
  @media (max-width: 600px) { .calculator-picker { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  :focus-visible { outline: 2px solid #9ac3ff; outline-offset: 2px; }
  @media (max-width: 740px) { .grid, .rates-fields { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1 id="calculator-menu-heading">Калькуляторы</h1>
  <div class="calculator-picker" role="group" aria-labelledby="calculator-menu-heading">
    <button type="button" id="coin-calculator-toggle" aria-controls="calculator" aria-expanded="false">Калькулятор Монет</button>
    <button type="button" id="craft-toggle" aria-controls="craft" aria-expanded="false">Калькулятор крафта</button>
    <button type="button" disabled>Калькулятор 3</button>
    <button type="button" disabled>Калькулятор 4</button>
    <button type="button" disabled>Калькулятор 5</button>
    <button type="button" disabled>Калькулятор 6</button>
  </div>
  <form id="calculator" aria-labelledby="coin-calculator-heading" hidden>
    <header><h2 id="coin-calculator-heading" class="calculator-heading">Калькулятор Монет</h2><button type="reset">Сбросить значения</button></header>
    <div id="panels"></div>
  </form>
  <section id="craft" aria-labelledby="craft-heading" hidden>
    <h2 id="craft-heading">Калькулятор крафта</h2>
    <div class="row"><label for="craft-chance">Шанс успеха, %</label><input id="craft-chance" inputmode="decimal" autocomplete="off"></div>
    <div class="row"><label for="craft-cost">Монет за клик</label><input id="craft-cost" inputmode="decimal" autocomplete="off"></div>
    <div class="row"><span id="craft-attempts-label">Среднее число попыток</span><output id="craft-attempts" aria-labelledby="craft-attempts-label"></output></div>
    <div class="row"><span id="craft-total-label">Средняя стоимость, монет</span><output id="craft-total" aria-labelledby="craft-total-label"></output></div>
    <p>Среднее до первого успеха при постоянном шансе. Фактический расход может отличаться.</p>
  </section>
</main>
<script>
'use strict';

const panels = [
  { title: 'Курсы USDT',
    fields: [['rubRate', '₽ за 1 USDT'], ['uahRate', '₴ за 1 USDT']],
    note: 'Курс в гривнах — справочное поле. В формулах листа используется курс в рублях.' },
  { title: 'Рубли → адена',
    fields: [['adenaBudget', 'Бюджет, ₽'], ['adenaBuyRub', 'Цена 1 млрд адены, ₽']],
    results: [['adenaBought', 'Получишь адены, млрд']] },
  { title: 'Покупка заданного объёма адены',
    fields: [['adenaTarget', 'Нужно адены'], ['coinInAdena', 'Цена 1 монеты, адена']],
    results: [['coinsNeeded', 'Нужно монет'], ['packsNeeded', 'Нужно упаковок по 3 200 монет'], ['packsRub', 'Стоимость, ₽']],
    note: 'Упаковка стоит 400 ₽. Дробное число упаковок учитывается в стоимости.' },
  { title: 'Адена → рубли, USDT и гривны',
    fields: [['adenaSold', 'Количество адены, млрд'], ['adenaSellRub', 'Цена 1 млрд адены, ₽'], ['adenaSellUah', 'Цена 1 млрд адены, ₴']],
    results: [['adenaRub', 'Получишь, ₽'], ['adenaUsdt', 'Получишь, USDT'], ['adenaUah', 'Получишь, ₴']] },
  { title: 'Рубли и гривны → монеты',
    fields: [['budgetUah', 'Бюджет, ₴'], ['budgetRub', 'Бюджет, ₽'], ['coinBuyRub', 'Цена 1 монеты, ₽'], ['coinBuyUah', 'Цена 1 монеты, ₴']],
    results: [['coinsFromRub', 'Монет за рубли'], ['coinsFromUah', 'Монет за гривны']] },
  { title: 'Монеты → рубли, USDT и гривны',
    fields: [['coinsSold', 'Количество монет'], ['coinSellRub', 'Цена 1 монеты, ₽'], ['coinSellUah', 'Цена 1 монеты, ₴']],
    results: [['coinRub', 'Получишь, ₽'], ['coinUsdt', 'Получишь, USDT'], ['coinUah', 'Получишь, ₴']],
    note: 'При пустой цене в гривнах результат в гривнах остаётся пустым.' },
  { title: 'Эфир и Солярис',
    fields: [['ether', 'Эфир, шт.'], ['solaris', 'Солярис, шт.']],
    results: [['etherCoins', 'Монет за эфир'], ['solarisCoins', 'Монет за Солярис']],
    note: '10 эфира за 32 монеты. 1 Солярис за 100 монет.' },
];

function calculate(values) {
  const coinsNeeded = values.adenaTarget / values.coinInAdena;
  const packsNeeded = coinsNeeded / 3200;
  const adenaRub = values.adenaSold * values.adenaSellRub;
  const coinRub = values.coinsSold * values.coinSellRub;
  return {
    adenaBought: values.adenaBudget / values.adenaBuyRub,
    coinsNeeded, packsNeeded, packsRub: packsNeeded * 400,
    adenaRub, adenaUsdt: adenaRub / values.rubRate, adenaUah: values.adenaSold * values.adenaSellUah,
    coinsFromRub: values.budgetRub / values.coinBuyRub,
    coinsFromUah: values.budgetUah / values.coinBuyUah,
    coinRub, coinUsdt: coinRub / values.rubRate, coinUah: values.coinsSold * values.coinSellUah,
    etherCoins: values.ether / 10 * 32,
    solarisCoins: values.solaris * 100,
  };
}

function parseNumber(raw) {
  const normalized = raw.trim().replace(/[\s\u00a0\u202f]/g, '').replace(',', '.');
  if (!normalized) return 0;
  if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(normalized)) return NaN;
  const value = Number(normalized);
  return Number.isFinite(value) ? value : NaN;
}

const quantityFormat = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 4 });
const currencyFormat = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usdtFormat = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
const resultFormats = {
  packsRub: currencyFormat,
  adenaRub: currencyFormat,
  adenaUah: currencyFormat,
  coinRub: currencyFormat,
  coinUah: currencyFormat,
  adenaUsdt: usdtFormat,
  coinUsdt: usdtFormat,
};

function formatInput(field) {
  const raw = field.value.trim().replace(/\s/g, '');
  if (!raw || !Number.isFinite(parseNumber(raw))) return;
  const [whole, fraction] = raw.replace('.', ',').split(',');
  const grouped = (whole || '0').replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
  field.value = fraction ? `${grouped === '-' || grouped === '+' ? grouped + '0' : grouped},${fraction}` : grouped;
}
const form = document.querySelector('#calculator');
const craft = document.querySelector('#craft');
const calculatorViews = [
  [document.querySelector('#coin-calculator-toggle'), form],
  [document.querySelector('#craft-toggle'), craft],
];

for (const [toggle, panel] of calculatorViews) {
  toggle.addEventListener('click', () => {
    const open = panel.hidden;
    for (const [button, view] of calculatorViews) {
      const selected = open && view === panel;
      view.hidden = !selected;
      button.setAttribute('aria-expanded', String(selected));
    }
  });
}

const inputs = new Map();
const outputs = new Map();

function renderPanel(panel, rates = false) {
  const section = document.createElement('section');
  const heading = document.createElement('h2');
  heading.textContent = panel.title;
  section.append(heading);
  const fields = document.createElement('div');
  if (rates) {
    section.className = 'rates';
    fields.className = 'rates-fields';
  }
  section.append(fields);
  for (const [key, label] of panel.fields ?? []) {
    const row = document.createElement('div');
    row.className = 'row';
    const caption = document.createElement('label');
    caption.htmlFor = key;
    caption.textContent = label;
    const input = document.createElement('input');
    input.id = key;
    input.inputMode = 'decimal';
    input.autocomplete = 'off';
    input.value = '';
    input.addEventListener('blur', () => formatInput(input));
    row.append(caption, input);
    fields.append(row);
    inputs.set(key, input);
  }
  for (const [key, label] of panel.results ?? []) {
    const row = document.createElement('div');
    row.className = 'row';
    const caption = document.createElement('span');
    caption.id = `${key}-label`;
    caption.textContent = label;
    const output = document.createElement('output');
    output.setAttribute('aria-labelledby', caption.id);
    row.append(caption, output);
    section.append(row);
    outputs.set(key, output);
  }
  if (panel.note) {
    const note = document.createElement('p');
    note.textContent = panel.note;
    section.append(note);
  }
  return section;
}

const requiredFields = {
  adenaBought: ['adenaBudget', 'adenaBuyRub'],
  coinsNeeded: ['adenaTarget', 'coinInAdena'],
  packsNeeded: ['adenaTarget', 'coinInAdena'],
  packsRub: ['adenaTarget', 'coinInAdena'],
  adenaRub: ['adenaSold', 'adenaSellRub'],
  adenaUsdt: ['adenaSold', 'adenaSellRub', 'rubRate'],
  adenaUah: ['adenaSold', 'adenaSellUah'],
  coinsFromRub: ['budgetRub', 'coinBuyRub'],
  coinsFromUah: ['budgetUah', 'coinBuyUah'],
  coinRub: ['coinsSold', 'coinSellRub'],
  coinUsdt: ['coinsSold', 'coinSellRub', 'rubRate'],
  coinUah: ['coinsSold', 'coinSellUah'],
  etherCoins: ['ether'],
  solarisCoins: ['solaris'],
};

function update() {
  const filled = new Set();
  const values = {};
  for (const [key, input] of inputs) {
    const value = parseNumber(input.value);
    values[key] = value;
    if (input.value.trim()) filled.add(key);
    input.setAttribute('aria-invalid', String(Number.isNaN(value)));
  }
  for (const [key, value] of Object.entries(calculate(values))) {
    const output = outputs.get(key);
    const ready = requiredFields[key].every(field => filled.has(field));
    const invalid = ready && !Number.isFinite(value);
    output.toggleAttribute('data-error', invalid);
    const formatter = resultFormats[key] ?? quantityFormat;
    output.value = ready ? (invalid ? 'Проверь ввод' : formatter.format(value)) : '';
  }
}

const [rates, ...calculators] = panels;
const grid = document.createElement('div');
grid.className = 'grid';
grid.append(...calculators.map(panel => renderPanel(panel)));
document.querySelector('#panels').append(renderPanel(rates, true), grid);
form.addEventListener('input', update);
form.addEventListener('reset', event => {
  event.preventDefault();
  for (const input of inputs.values()) input.value = '';
  update();
});
form.addEventListener('submit', event => event.preventDefault());
update();
const craftChance = document.querySelector('#craft-chance');
const craftCost = document.querySelector('#craft-cost');
const craftAttempts = document.querySelector('#craft-attempts');
const craftTotal = document.querySelector('#craft-total');

function updateCraft() {
  const hasChance = craftChance.value.trim() !== '';
  const hasCost = craftCost.value.trim() !== '';
  const chance = parseNumber(craftChance.value);
  const cost = parseNumber(craftCost.value);
  const validChance = chance > 0 && chance <= 100;
  const validCost = Number.isFinite(cost) && cost >= 0;
  const attempts = 100 / chance;
  const total = attempts * cost;
  const badChance = hasChance && (!validChance || !Number.isFinite(attempts));
  const badCost = hasCost && !validCost;
  craftChance.setAttribute('aria-invalid', String(badChance));
  craftCost.setAttribute('aria-invalid', String(badCost));
  craftAttempts.toggleAttribute('data-error', badChance);
  const ready = hasChance && hasCost && !badChance && !badCost;
  const badTotal = ready && !Number.isFinite(total);
  craftTotal.toggleAttribute('data-error', badTotal);
  craftAttempts.value = !hasChance ? '' : badChance ? 'Проверь шанс' : quantityFormat.format(attempts);
  craftTotal.value = !ready ? '' : badTotal ? 'Слишком большое число' : quantityFormat.format(total);
}

for (const field of [craftChance, craftCost]) {
  field.addEventListener('input', updateCraft);
  field.addEventListener('blur', () => formatInput(field));
}
updateCraft();
</script>
</body>
</html>
